<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Hunter Agent</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Job Hunter Agent</h1>
            <p>AI-powered job search, matching & interview prep</p>
        </div>

        <!-- View 1: Search Form -->
        <div id="view-form" class="view active glass-card">
            <form id="search-form">
                <div class="upload-area" id="upload-box">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p id="file-label">Drag & drop your resume (PDF/DOCX) or click to browse</p>
                    <input type="file" id="resume-upload" accept=".pdf,.docx,.txt" style="display: none;">
                </div>

                <div class="form-group">
                    <label for="role">Job Role</label>
                    <input type="text" id="role" class="form-control" placeholder="e.g. ML Engineer Intern, Data Scientist" required>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. India, Remote, Bangalore" value="India">
                </div>

                <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; margin-bottom: 1rem;">Search Jobs</button>
                <div style="text-align: center;">
                    <a href="#" style="color: var(--text-muted); text-decoration: underline; font-size: 0.9rem;">View Search History</a>
                </div>
            </form>
        </div>

        <!-- View 2: Progress -->
        <div id="view-progress" class="view glass-card">
            <div class="progress-container">
                <h2 id="progress-text" style="margin-bottom: 1rem; color: var(--accent);">Initializing...</h2>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
                <p id="progress-percent" style="font-size: 1.5rem; font-weight: bold; margin-bottom: 2rem;">0%</p>
                <button id="cancel-btn" class="btn btn-outline">Cancel</button>
            </div>
        </div>

        <!-- View 3: Results -->
        <div id="view-results" class="view">
            <div class="results-header glass-card" style="padding: 1.5rem;">
                <h2 id="summary-text" style="font-size: 1.25rem;">Found 0 jobs — Average match score: 0.0/5</h2>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button id="export-btn" class="btn btn-outline" style="padding: 0.5rem 1rem;">Export to CSV</button>
                    <button id="new-search-btn" class="btn" style="padding: 0.5rem 1rem;">New Search</button>
                </div>
            </div>

            <div id="jobs-grid" class="jobs-grid">
                <!-- Job cards injected via JS -->
            </div>
        </div>
    </div>

    <!-- Prep Modal -->
    <div id="prep-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Interview Prep Guide ✨</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <div class="tab active" data-target="tab-resume">Tailored Resume</div>
                    <div class="tab" data-target="tab-research">Company Research</div>
                    <div class="tab" data-target="tab-interview">Interview Prep</div>
                </div>
                
                <div id="tab-resume" class="tab-content active">
                    <button id="download-resume" class="btn btn-small" style="margin-bottom: 1rem; float: right;">Download .md</button>
                    <div id="content-resume" class="markdown-body"></div>
                </div>
                <div id="tab-research" class="tab-content">
                    <button id="download-research" class="btn btn-small" style="margin-bottom: 1rem; float: right;">Download .md</button>
                    <div id="content-research" class="markdown-body"></div>
                </div>
                <div id="tab-interview" class="tab-content">
                    <button id="download-interview" class="btn btn-small" style="margin-bottom: 1rem; float: right;">Download .md</button>
                    <div id="content-interview" class="markdown-body"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/upload.js"></script>
    <script src="js/poller.js"></script>
    <script src="js/results.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
