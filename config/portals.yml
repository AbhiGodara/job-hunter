# Title filter — controls which job titles are included in results.
# ALL jobs (ATS + Playwright) must have at least 1 positive keyword
# and zero negative keywords to be considered.
#
# The code also adds role-query words as dynamic keywords (AND logic),
# and adds senior/staff/principal etc. to negatives for intern/entry searches.
title_filter:
  positive:
    - "ML"
    - "Machine Learning"
    - "AI"
    - "Artificial Intelligence"
    - "Data Science"
    - "Data Scientist"
    - "Data Engineer"
    - "Deep Learning"
    - "NLP"
    - "LLM"
    - "GenAI"
    - "Generative AI"
    - "Computer Vision"
    - "MLOps"
    - "Python"
    - "Backend"
    - "Software Engineer"
    - "Software Developer"
    - "Full Stack"
    - "Research Scientist"
    - "Research Engineer"
    - "Applied Scientist"
    - "Platform Engineer"
    - "Infrastructure Engineer"
  negative:
    - "Intern"
    - "Sales"
    - "Account Executive"
    - "Account Manager"
    - "Marketing"
    - "HR"
    - "Human Resources"
    - "Recruiter"
    - "Finance"
    - "Legal"
    - "Counsel"
    - "Designer"
    - "UX"
    - "iOS"
    - "Android"
    - "Mobile"
    - "Operations"
    - "Customer Success"
    - "Customer Support"
    - "Customer Engineer"
    - "Solutions Engineer"
    - "Solution Engineer"
