  - name: "Google DeepMind"
    careers_url: "https://deepmind.google/careers/"
    enabled: true

# Title filter — used when scraping to decide if a job is relevant
# At least 1 positive keyword must appear in the title
# 0 negative keywords must appear in the title
title_filter:
  positive:
    - "ML"
    - "Machine Learning"
    - "AI"
    - "Data Science"
    - "Data Scientist"
    - "Data Engineer"
    - "Deep Learning"
    - "NLP"
    - "LLM"
    - "Python"
    - "Backend"
    - "Software Engineer"
    - "Software Developer"
    - "Full Stack"
    - "Research"
  negative:
    - "Intern"
    - "Sales"
    - "Marketing"
    - "HR"
    - "Finance"
    - "Legal"
    - "Designer"
    - "iOS"
    - "Android"