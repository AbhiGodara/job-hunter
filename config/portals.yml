# Job portal configuration
# search_engine.py reads PORTALS from backend/config.py — this file is used by scraper_portals (Playwright)
# The real portal list is in backend/config.py

# Tracked companies for direct Playwright scraping
# Add any company you want to track here with their exact careers page URL
tracked_companies:

  # --- Greenhouse companies (also have free JSON API) ---
  - name: "Anthropic"
    careers_url: "https://job-boards.greenhouse.io/anthropic"
    api: "https://boards-api.greenhouse.io/v1/boards/anthropic/jobs"
    enabled: true

  - name: "Airtable"
    careers_url: "https://job-boards.greenhouse.io/airtable"
    api: "https://boards-api.greenhouse.io/v1/boards/airtable/jobs"
    enabled: true

  - name: "Vercel"
    careers_url: "https://job-boards.greenhouse.io/vercel"
    api: "https://boards-api.greenhouse.io/v1/boards/vercel/jobs"
    enabled: true

  - name: "Intercom"
    careers_url: "https://job-boards.greenhouse.io/intercom"
    api: "https://boards-api.greenhouse.io/v1/boards/intercom/jobs"
    enabled: true

  - name: "Glean"
    careers_url: "https://job-boards.greenhouse.io/gleanwork"
    api: "https://boards-api.greenhouse.io/v1/boards/gleanwork/jobs"
    enabled: true

  - name: "Temporal"
    careers_url: "https://job-boards.greenhouse.io/temporal"
    api: "https://boards-api.greenhouse.io/v1/boards/temporal/jobs"
    enabled: true

  - name: "Retool"
    careers_url: "https://job-boards.greenhouse.io/retool"
    api: "https://boards-api.greenhouse.io/v1/boards/retool/jobs"
    enabled: true

  # --- Ashby companies ---
  - name: "ElevenLabs"
    careers_url: "https://jobs.ashbyhq.com/elevenlabs"
    enabled: true

  - name: "Deepgram"
    careers_url: "https://jobs.ashbyhq.com/deepgram"
    enabled: true

  - name: "Vapi"
    careers_url: "https://jobs.ashbyhq.com/vapi"
    enabled: true

  - name: "Cursor"
    careers_url: "https://jobs.ashbyhq.com/cursor"
    enabled: true

  - name: "Perplexity"
    careers_url: "https://jobs.ashbyhq.com/perplexityai"
    enabled: true

  # --- Lever companies ---
  - name: "Scale AI"
    careers_url: "https://jobs.lever.co/scaleai"
